# Nginx cho Hub — thi hành ADR-018 (Nginx + Let's Encrypt đứng trước PM2).
# certbot --nginx sẽ tự chèn khối TLS + redirect 80→443 vào file này; đừng viết tay
# phần TLS trước khi chạy certbot (viết tay là certbot chèn chồng, ra hai khối server).
server {
    listen 80;
    server_name hub.truongvietanh.com;

    # Thân request: webhook mini app nhận payload JSON nhỏ; 2m là trần rộng rãi.
    client_max_body_size 2m;

    # Nén cho HTML/JS/CSS — ảnh và video KHÔNG (đã nén sẵn, gzip chỉ đốt CPU).
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # BA HEADER NÀY LÀ XƯƠNG SỐNG, không phải trang trí:
        # - Host: oidc-provider dựng issuer/endpoint theo Host thật;
        # - X-Forwarded-Proto: `provider.proxy = true` + cookie `Secure` đều đọc nó —
        #   thiếu là discovery sinh http:// và cookie phiên không Secure (đúng lỗi mà
        #   chú thích trong provider.ts đã kể cho thời tunnel);
        # - X-Forwarded-For: rate-limit đếm theo IP người thật, không phải IP của Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE/long-poll của Next dev không có ở prod, nhưng video tải dài thì có.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Tài nguyên tĩnh bất biến của Next: cache thẳng ở Nginx, đỡ một lượt vào Node.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
